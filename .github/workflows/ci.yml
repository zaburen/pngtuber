name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catch advisories published after a dependency was vetted.
    - cron: "0 6 * * 1"

# Cancel superseded runs on the same ref (a new push to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build, check, test, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # rust-embed needs build/ to exist; also validates the Svelte build.
      - run: npm run build
      - run: npm run check
      - run: npm test
      # Fail only on moderate+ advisories; low dev-only noise stays a warning.
      - run: npm audit --audit-level=moderate

  rust:
    name: Rust (test, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tauri v2 build/link prerequisites on Ubuntu.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            libudev-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # rust-embed's Frontend/BundledAvatars folders must exist to compile.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri # Cargo.lock lives here, not at repo root
