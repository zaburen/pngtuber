name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catch advisories published after a dependency was vetted.
    - cron: "0 6 * * 1"

# Cancel superseded runs on the same ref (a new push to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the repo.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (build, check, test, audit)
    # Windows is the primary target; run the checks on both so a platform-specific
    # bug can't pass locally (Windows) yet fail in CI (Linux), or vice versa.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `tauri build` refuses a major/minor mismatch between the Rust `tauri`
      # crate and @tauri-apps/api, but CI never runs `tauri build`. Check it
      # cheaply here so a lockfile drift (e.g. a cargo bump moving the crate)
      # can't slip through green CI and only surface at release time.
      - name: Tauri crate/npm version consistency
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node -e '
            const fs=require("fs");
            const lock=fs.readFileSync("src-tauri/Cargo.lock","utf8");
            const m=lock.match(/name = "tauri"\nversion = "([^"]+)"/);
            const api=require("./node_modules/@tauri-apps/api/package.json").version;
            const mm=v=>v.split(".").slice(0,2).join(".");
            if(!m){console.error("::error::could not find the tauri crate in Cargo.lock");process.exit(1);}
            console.log("rust tauri="+m[1]+"  npm @tauri-apps/api="+api);
            if(mm(m[1])!==mm(api)){console.error("::error::tauri crate "+m[1]+" and @tauri-apps/api "+api+" differ on major.minor - tauri build will refuse. Align them.");process.exit(1);}
          '
      # rust-embed needs build/ to exist; also validates the Svelte build.
      - run: npm run build
      - run: npm run check
      - run: npm test
      # Fail only on moderate+ advisories; low dev-only noise stays a warning.
      # Result is OS-independent (same lockfile), so run it once on Linux.
      - run: npm audit --audit-level=moderate
        if: runner.os == 'Linux'

  rust:
    name: Rust (test, audit)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Tauri v2 build/link prerequisites on Ubuntu (Windows needs none of these).
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            libudev-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # rust-embed's Frontend/BundledAvatars folders must exist to compile.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
      # Audit only on Linux: cargo-audit reads the same lockfile on either OS, and
      # the only advisories in scope are Tauri's transitive GTK stack (Linux-only,
      # no upstream fix). Building cargo-audit on Windows would add minutes for
      # nothing. Fails the build on an actual vulnerability.
      - name: Install cargo-audit
        if: runner.os == 'Linux'
        run: cargo install cargo-audit --locked
      - name: cargo audit
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo audit
